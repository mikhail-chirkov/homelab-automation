- name: Update VM parameters
  community.general.proxmox_kvm:
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ api_token_secret }}"
    api_host: "{{ inventory_hostname }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ node_base_vmid | int + item }}"
    memory: "{{ vm.memory }}"
    cores: "{{ vm.cores }}"
    ipconfig:
      ipconfig0: 'ip=dhcp'
    cicustom: 'user=local:snippets/{{ vm.name }}{{ node_base_vmid | int + item }}-user-data.yml'
    update: true
  loop: "{{ range(0, vm.count) | list }}"

- name: Resize VM
  community.general.proxmox_disk:
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ api_token_secret }}"
    api_host: "{{ inventory_hostname }}"
    vmid: "{{ node_base_vmid | int + item }}"
    disk: "scsi0"
    size: "{{ vm.disk }}"
    state: "resized"
  loop: "{{ range(0, vm.count) | list }}"

- name: Start VM
  community.general.proxmox_kvm:
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ api_token_secret }}"
    api_host: "{{ inventory_hostname }}"
    vmid: "{{ node_base_vmid | int + item }}"
    state: "started"
  loop: "{{ range(0, vm.count) | list }}"